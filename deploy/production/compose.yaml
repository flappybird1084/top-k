services:
  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JUDGES_HOST: 0.0.0.0
      JUDGES_PORT: 8768
      JUDGES_ORIGIN: https://top-k.dev
      GITHUB_AUTH_ORIGIN: https://api.top-k.dev
      GITHUB_AUTH_DB: /var/lib/top-k/auth/github-auth.sqlite
      JUDGES_INTEGRATION_DIR: /var/lib/top-k/integrations
      KEVO_RELAY_LEDGER: /var/lib/top-k/relay/usage.json
      KEVO_UI_TARGET: molab
      KEVO_UI_LLM: wandb
    volumes:
      - ${TOPK_DATA_ROOT:-/srv/top-k-data}/state:/var/lib/top-k
      - ${TOPK_DATA_ROOT:-/srv/top-k-data}/jobs:/app/jobs
    networks:
      - origin
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,urllib.request;
          r=urllib.request.Request('http://127.0.0.1:8768/api/auth/config',headers={'Origin':'https://top-k.dev','X-TopK-Edge-Auth':os.environ['JUDGES_EDGE_SECRET']});
          assert urllib.request.urlopen(r,timeout=5).status==200
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - origin

networks:
  origin:
