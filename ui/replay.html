<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top-Kernel · Replay run</title>
<link rel="stylesheet" href="run.css?v=theme-1"><link rel="stylesheet" href="theme.css?v=1"><link rel="stylesheet" href="project-replay.css?v=2">
<script defer src="project-replay-model.js?v=2"></script><script defer src="project-replay.js?v=2"></script></head>
<body class="theme-app theme-run replay-app">
<nav class="app-nav" aria-label="Main navigation"><a class="app-brand" href="index.html">Top-K<small>ernel</small></a><div><a href="index.html#web">Projects</a><a href="start.html">New run ↗</a></div></nav>
<main>
<header class="replay-heading"><div><a id="project-repo" target="_blank" rel="noopener noreferrer"></a><h1 id="project-title">Loading run…</h1></div><div><span id="run-state" role="status"></span><button id="restart-run" type="button" disabled>Replay run ↻</button></div></header>
<div id="replay-progress" role="progressbar" aria-label="Run progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
<nav class="replay-tabs" aria-label="Run views">
<button data-view="exploration" aria-current="page">Exploration</button><button data-view="dashboard">Dashboard</button><button data-view="results" disabled>Results</button>
<span></span><button data-view="wandb"><img src="assets/wandb-sprite.png" alt="">W&B</button><button data-view="marimo"><img src="assets/marimo-sprite.png" alt="">marimo</button><button data-view="aria"><img src="assets/coreweave-sprite.png" alt="">ARIA</button></nav>
<p id="replay-error" role="alert" hidden></p>
<section id="exploration-view"><div class="section-heading"><h2>Search generations</h2><button class="replay-primary" data-view="dashboard">Open dashboard ↗</button></div><iframe id="exploration-frame" title="Architecture and kernel search generations"></iframe></section>
<section id="dashboard-view" hidden><div class="section-heading"><h2>Performance</h2><button class="replay-primary" data-view="results" disabled>Final results ↗</button></div><p id="run-metadata" class="quiet"></p><div id="dashboard-metrics" class="replay-grid"></div><div class="sponsor-grid"><button data-view="wandb"><img src="assets/wandb-sprite.png" alt=""><span>W&B</span><svg id="wandb-mini" viewBox="0 0 300 80" aria-label="Candidate measurements"></svg></button><button data-view="marimo"><img src="assets/marimo-sprite.png" alt=""><span>marimo</span><svg id="marimo-mini" viewBox="0 0 300 80" aria-label="Completed evaluations"></svg></button><button data-view="aria"><img src="assets/coreweave-sprite.png" alt=""><span>ARIA</span><svg id="aria-mini" viewBox="0 0 300 80" aria-label="Accepted candidates"></svg></button></div></section>
<section id="results-view" hidden><div class="section-heading"><h2>Final results</h2><a id="evidence-link" target="_blank" rel="noopener noreferrer">Evidence ↗</a></div><div id="final-metrics" class="replay-grid"></div><div class="replay-actions"><button data-view="wandb">W&B ↗</button><button data-view="marimo">marimo ↗</button><button data-view="aria">Ask ARIA ↗</button><a href="start.html" class="replay-primary">Run your repository ↗</a></div></section>
<section id="wandb-view" hidden><div class="section-heading"><h2 class="sponsor-heading"><img src="assets/wandb-sprite.png" alt="">Weights & Biases</h2><a id="wandb-source" target="_blank" rel="noopener noreferrer">Open W&B ↗</a></div><div id="wandb-charts" class="replay-grid"></div><div id="evaluation-table" class="table-scroll"></div></section>
<section id="marimo-view" hidden><div class="section-heading"><h2 class="sponsor-heading"><img src="assets/marimo-sprite.png" alt="">marimo</h2><a id="notebook-source" target="_blank" rel="noopener noreferrer" hidden>Open notebook ↗</a></div><div id="notebook-progress" class="replay-grid"></div><iframe id="project-notebook" title="marimo benchmark notebook" hidden></iframe></section>
<section id="aria-view" hidden><div class="section-heading"><h2 class="sponsor-heading"><img src="assets/coreweave-sprite.png" alt="">Ask ARIA</h2><a id="aria-source" target="_blank" rel="noopener noreferrer">Open in W&B ↗</a></div><div id="aria-charts" class="replay-grid"></div><div class="aria-request"><label for="aria-prompt">Analysis prompt</label><textarea id="aria-prompt" rows="5" readonly></textarea><button id="copy-analysis" class="replay-primary">Copy prompt</button><span id="copy-status" role="status"></span></div></section>
</main></body></html>
