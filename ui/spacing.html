<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top-Kernel — Spacing comparison</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ebe5;color:#293126;font:14px Arial,sans-serif}header{padding:20px 24px;display:flex;align-items:center;gap:20px;background:#fdfefb;border-bottom:1px solid #d6dbcf}h1{font:22px Georgia,serif;margin:0}header span{color:#737b6c;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,500px);gap:16px;padding:24px;width:max-content}.label{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:8px}.label strong{font-size:16px;font-weight:500}.label span{color:#737b6c;font:11px monospace}.frame{overflow:hidden;border:1px solid #d3d9ca;background:#fdfefb}iframe{display:block;width:500px;height:700px;border:0;transform-origin:top left}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}
</style></head><body><header><h1>Top-K<small>ernel</small></h1><span>Sprites → title · 100% scale · motion frozen</span></header><main class="grid" id="grid"></main><script>
const grid=document.querySelector('#grid');
[20,40,60,80].forEach(percent=>{const section=document.createElement('section');section.innerHTML=`<div class="label"><a href="index.html?gap=${percent}&v=4" target="_blank" rel="noopener"><strong>−${percent}% ↗</strong></a><span>${(29*(1-percent/100)).toFixed(1)}px</span></div><div class="frame"><iframe title="${percent} percent less sprite-to-title spacing" src="index.html?gap=${percent}&v=4"></iframe></div>`;grid.append(section)});
</script></body></html>
