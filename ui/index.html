<!doctype html>
<html lang="en">
<head><script src="live-api.js?v=2"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Top-Kernel</title><meta name="description" content="Start with your repository. Evolve faster training kernels."><link rel="stylesheet" href="front.css?v=settings-local-1"><script src="front.js?v=23" defer></script></head>
<body>

<main>
<div class="sprites" aria-label="Built with CoreWeave, marimo, and Weights & Biases">
<div class="sprite coreweave" tabindex="0"><img src="assets/coreweave-sprite.png" alt="CoreWeave pixel sprite" width="100" height="100"><span>CoreWeave</span></div>
<div class="sprite marimo" tabindex="0"><img src="assets/marimo-sprite.png" alt="marimo pixel sprite" width="100" height="100"><span>marimo</span></div>
<div class="sprite wandb" tabindex="0"><img src="assets/wandb-sprite.png" alt="Weights & Biases pixel sprite" width="100" height="100"><span>W&B</span></div>
</div>
<h1><span class="project-name">Top-K<small>ernel</small></span></h1>
<form id="repo-form" novalidate>
<label class="sr-only" for="repository">Repository URL</label>
<div class="repo-field"><span class="repo-icon" aria-hidden="true">↳</span><input id="repository" name="repository" type="text" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="Paste your repository or branch URL" aria-describedby="form-note" required><button type="submit" aria-label="Continue with this repository"><span aria-hidden="true">↗</span></button></div>
<p id="form-note" role="status"></p>
<section id="agent-flow" aria-label="Agent progress" hidden>
<div id="agent-progress" role="progressbar" aria-label="Repository review progress" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><span></span></div>
<div class="flow-heading"><span>AGENT ACTIVITY</span><button id="stop-flow" type="button">Stop</button></div>
<ol id="agent-events" aria-live="polite" aria-relevant="additions text"></ol>

</section>
<label class="mode-choice"><span>Optimize</span><select id="search-mode" aria-label="Optimization mode"><option value="recipe">Architecture</option><option value="kernel" selected>Kernels</option><option value="both">Both</option></select><button type="button" id="open-settings">Settings</button></label></form>
</main>
<footer><a href="pitch.html" style="color:inherit;text-decoration:none">Pitch walkthrough ↗</a><span>CoreWeave Hacks</span></footer>
<dialog id="data-dialog" aria-labelledby="data-title" aria-describedby="data-caption">
<button id="close-data" type="button" aria-label="Close data dialog">×</button>
<h2 id="data-title">Data?</h2>
<p id="data-caption">Add the Hugging Face or data link for your training run.</p>
<p id="discovery-summary"></p><div id="dataset-options"></div>
<form id="data-form" novalidate>
<label class="sr-only" for="data-link">Hugging Face or data repository URL</label>
<div class="repo-field"><input id="data-link" type="text" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" placeholder="huggingface.co/datasets/…" aria-describedby="data-error"><button type="submit" aria-label="Use training data">↗</button></div>
<p id="data-error" role="alert"></p>
</form>
<div id="data-check" hidden><span class="spinner" aria-hidden="true"></span><p id="data-check-text" role="status"></p></div>
</dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title">
<button id="close-settings" type="button" aria-label="Close settings">×</button>
<h2 id="settings-title">Settings</h2>
<p class="settings-caption">All optional — blank fields use the server defaults.</p>
<form id="settings-form" novalidate>
<div class="settings-grid">
<label>LLM provider<select id="s-llm"><option value="">server default</option><option>claude_oauth:sonnet</option><option>claude_oauth:opus</option><option>claude_oauth:haiku</option><option>codex_oauth</option><option>wandb</option><option>anthropic</option><option>openai</option><option>stub</option></select></label>
<label>Profile<select id="s-profile"><option value="">server default</option><option>DEV</option><option>RUN</option></select></label>
<label>Spend cap ($)<input id="s-spend" type="number" min="1" max="500" step="0.5" placeholder="profile default"></label>
<label>Adapter debug turns<input id="s-debug" type="number" min="1" max="10" placeholder="5"></label>
</div>
<label class="settings-wide">Molab connection — paste the notebook’s “Pair with agent” prompt<textarea id="s-molab" rows="3" placeholder="blank = server connection file"></textarea></label>
<p id="settings-conn-note"></p>
<details class="settings-recipe"><summary>Recipe schedule (architecture mode)</summary>
<div class="settings-grid three">
<label>Arch generations<input id="s-arch-gens" type="number" min="0" max="10" placeholder="2"></label>
<label>× candidates<input id="s-arch-cands" type="number" min="1" max="16" placeholder="8"></label>
<label>× train secs<input id="s-arch-secs" type="number" min="10" max="3600" placeholder="60"></label>
<label>HP generations<input id="s-hp-gens" type="number" min="0" max="10" placeholder="1"></label>
<label>× candidates<input id="s-hp-cands" type="number" min="1" max="16" placeholder="8"></label>
<label>× train secs<input id="s-hp-secs" type="number" min="10" max="3600" placeholder="120"></label>
<label>Finals top-k<input id="s-finals-k" type="number" min="1" max="8" placeholder="2"></label>
<label>Finals secs<input id="s-finals-secs" type="number" min="10" max="7200" placeholder="300"></label>
<label>Parallel agents<input id="s-par" type="number" min="1" max="16" placeholder="8"></label>
<label>Parent pool<input id="s-pool" type="number" min="1" max="16" placeholder="4"></label>
<label>Eval batches<input id="s-evalb" type="number" min="1" max="64" placeholder="8"></label>
<label>Loss margin<input id="s-margin" type="number" min="0" max="0.2" step="0.001" placeholder="0.003"></label>
</div></details>
<div class="settings-actions"><button type="button" id="reset-settings">Reset</button><button type="submit">Done</button></div>
</form>
</dialog>
</body></html>
