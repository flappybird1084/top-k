      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

6#92;\u0026quot;Use a scaled RoPE base for longer-context position encoding and add post-LN layer scaling with a wider MLP under the parameter cap.\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Candidate\u0026#92;\u0026quot;:12,\u0026#92;\u0026quot;Generation\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;Phase\u0026#92;\u0026quot;:\u0026#92;\u0026quot;architecture\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Budget (s)\u0026#92;\u0026quot;:60,\u0026#92;\u0026quot;Validation loss\u0026#92;\u0026quot;:6.15234375,\u0026#92;\u0026quot;Strategy\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Take the parallel transformer block from parent 8 and also switch its attention to grouped-query attention with 8 query groups per shared KV head; keep the existing small width increase and verify that total key/value dimensions are divisible by both kv_head and head_dim.\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Candidate\u0026#92;\u0026quot;:13,\u0026#92;\u0026quot;Generation\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;Phase\u0026#92;\u0026quot;:\u0026#92;\u0026quot;architecture\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Budget (s)\u0026#92;\u0026quot;:60,\u0026#92;\u0026quot;Validation loss\u0026#92;\u0026quot;:null,\u0026#92;\u0026quot;Strategy\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Take the grouped-query attention setup from parent 7 and convert every transformer block into a parallel block where attention and MLP are computed in parallel and summed; preserve the GQA head divisibility and stay within the parameter cap.\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Candidate\u0026#92;\u0026quot;:14,\u0026#92;\u0026quot;Generation\u0026#92;\u0026quot;:2,\u0026#92;\u0026quot;Phase\u0026#92;\u0026quot;:\u0026#92;\u0026quot;architecture\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Budget (s)\u0026#92;\u0026quot;:60,\u0026#92;\u0026quot;Validation loss\u0026#92;\u0026quot;:6.16015625,\u0026#92;\u0026quot;Strategy\u0026#92;\u0026quot;:\u0026#92;\u0026quot;In parent 8\u0026#x27;s parallel transformer ot;Strategy\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Starting from parent 19, lower the AdamW learning rate from the baseline by ~40% and extend the warmup fraction to 0.2 of total steps, keeping cosine decay; this tests whether slower early updates stabilize the best parallel/GQA/depth model under a short budget.\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Candidate\u0026#92;\u0026quot;:21,\u0026#92;\u0026quot;Generation\u0026#92;\u0026quot;:3,\u0026#92;\u0026quot;Phase\u0026#92;\u0026quot;:\u0026#92;\u0026quot;hyperparam\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Budget (s)\u0026#92;\u0026quot;:120,\u0026#92;\u0026quot;Validation loss\u0026#92;\u0026quot;:5.5859375,\u0026#92;\u0026quot;Strategy\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Starting from parent 19, raise the AdamW learning rate by ~50% and shorten warmup to 5% of steps, add gradient clipping at 0.5, to test whether faster movement improves final validation loss within 120s.\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Candidate\u0026#92;\u0026quot;:22,\u0026#92;\u0026quot;Generation\u0026#92;\u0026quot;:3,\u0026#92;\u0026quot;Phase\u0026#92;\u0026quot;:\u0026#92;\u0026quot;hyperparam\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Budget (s)\u0026#92;\u0026quot;:120,\u0026#92;\u0026quot;Validation loss\u0026#92;\u0026quot;:null,\u0026#92;\u0026quot;Strategy\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Starting from parent 19, switch AdamW beta2 to 0.95 (leaving beta1=0.9) and lower weight decay to 0.01 to test the effect of faster second-moment adaptation.\u0026#92;\u0026quot;},{\u0026#92;\u0026quot;Candidate\u0026#92;\u0026quot;:23,\u0026#92;\u0026quot;Generation\u0026#92;\u0026quot;:3,\u0026#92;\u0026quot;Phase\u0026#92;\u0026quot;:\u0026#92;\u0026quot;hyperparam\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Budget (s)\u0026#92;\u0026quot;:120,\u0026#92;\u0026quot;Validation loss\u0026#92;\u0026quot;:5.58984375,\u0026#92;\u0026quot;Strategy\u0026#92;\u0026quot;:\u0026#92;\u0026quot;Starting from parent 19, increas
